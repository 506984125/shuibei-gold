<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="data:application/json,{}" id="manifest-placeholder">
<title>阅读打卡表</title>
<style>
@page { margin: 12mm 10mm; size: A4 portrait; }
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'PingFang SC','Microsoft YaHei','SimSun','Helvetica Neue',sans-serif;
  color: #222; padding: 12px; max-width: 480px; margin: 0 auto;
  background: #fff;
}

/* ===== Mobile Form ===== */
.form-section { margin-bottom: 16px; }
.form-section h2 { font-size: 15px; color: #444; margin-bottom: 8px; }
.form-group { margin-bottom: 10px; }
.form-group label { display: block; font-size: 13px; color: #888; margin-bottom: 3px; }
.form-group input, .form-group select {
  width: 100%; border: 1px solid #ddd; border-radius: 8px;
  padding: 10px 12px; font-size: 15px; outline: none;
  font-family: inherit; background: #fff;
}
.form-group input:focus { border-color: #4a90d9; }
.form-row { display: flex; gap: 8px; }
.form-row .form-group { flex: 1; }
.btn {
  width: 100%; padding: 13px; border: none; border-radius: 10px;
  font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 8px;
}
.btn-primary { background: #4a90d9; color: #fff; }
.btn-primary:active { opacity: .8; }
.btn-outline { background: #fff; color: #4a90d9; border: 1.5px solid #4a90d9; }
.btn-outline:active { background: #f0f6ff; }

/* ===== Today's entries ===== */
.entries { margin-bottom: 16px; }
.entries h3 { font-size: 14px; color: #666; margin-bottom: 6px; }
.entry-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; background: #f8f8f8; border-radius: 8px;
  margin-bottom: 6px; font-size: 14px;
}
.entry-item .info { flex: 1; }
.entry-item .book { font-weight: 600; }
.entry-item .pages { color: #4a90d9; font-size: 13px; }
.entry-item .note { color: #888; font-size: 12px; margin-top: 1px; }
.entry-item .del { color: #e74c3c; font-size: 18px; padding: 4px; cursor: pointer; }
.empty-msg { text-align: center; color: #ccc; font-size: 14px; padding: 16px 0; }

/* ===== Stats ===== */
.stats-bar {
  display: flex; gap: 6px; margin-bottom: 12px;
}
.stat-card {
  flex: 1; background: #f5f8ff; border-radius: 10px;
  padding: 10px 6px; text-align: center;
}
.stat-card .num { font-size: 22px; font-weight: 700; color: #4a90d9; }
.stat-card .lbl { font-size: 11px; color: #999; margin-top: 1px; }

/* ===== Print Layout ===== */
.print-container { display: none; }

@media print {
  body { padding: 0; max-width: none; background: #fff; }
  .no-print { display: none !important; }
  .print-container { display: block; }
}

/* ===== Print Table ===== */
.print-container h1 { text-align: center; font-size: 22px; letter-spacing: 4px; margin-bottom: 2px; }
.print-container .sub { text-align: center; font-size: 13px; color: #666; margin-bottom: 10px; }

.print-container table { width: 100%; border-collapse: collapse; font-size: 11px; }
.print-container th, .print-container td {
  border: 1px solid #333; padding: 4px 3px; text-align: center; height: 23px;
}
.print-container th { background: #e8e8e8; font-weight: 700; font-size: 11px; }
.print-container .col-day { width: 28px; }
.print-container .col-date { width: 30px; }
.print-container .col-book { width: 18%; }
.print-container .col-from { width: 24px; }
.print-container .col-to { width: 24px; }
.print-container .col-pages { width: 28px; }
.print-container .col-note { width: auto; }
.print-container .col-sign { width: 44px; }

.print-container .sign-row {
  display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: #666;
}
.print-container .info-row {
  display: flex; justify-content: space-between; margin: 8px 0;
  font-size: 12px; color: #444;
}
</style>
</head>
<body>

<!-- ===== Mobile View ===== -->
<div class="no-print">

<div class="stats-bar" id="statsBar">
  <div class="stat-card"><div class="num" id="sDays">0</div><div class="lbl">本月天数</div></div>
  <div class="stat-card"><div class="num" id="sBooks">0</div><div class="lbl">本月书本</div></div>
  <div class="stat-card"><div class="num" id="sPages">0</div><div class="lbl">总页数</div></div>
</div>

<div class="form-section">
  <h2>📝 打卡登记</h2>
  <div class="form-group">
    <label>日期</label>
    <input type="date" id="fDate">
  </div>
  <div class="form-group">
    <label>书名</label>
    <input type="text" id="fBook" placeholder="比如：西游记" list="bookList">
    <datalist id="bookList"></datalist>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>从第几页</label>
      <input type="number" id="fFrom" placeholder="1" min="1">
    </div>
    <div class="form-group">
      <label>到第几页</label>
      <input type="number" id="fTo" placeholder="15" min="1">
    </div>
  </div>
  <div class="form-group">
    <label>读了什么（简单写一两句）</label>
    <input type="text" id="fNote" placeholder="例：孙悟空三打白骨精">
  </div>
  <button class="btn btn-primary" onclick="saveEntry()">✅ 打卡</button>
  <button class="btn btn-outline" onclick="showPrint()">🖨️ 显示打印版表格</button>
</div>

<div class="entries">
  <h3>📋 本月记录</h3>
  <div id="entryList"><div class="empty-msg">暂无记录</div></div>
</div>

</div>

<!-- ===== Print Table ===== -->
<div class="print-container" id="printArea">
  <h1>📖 阅读打卡表</h1>
  <p class="sub" id="printMonth">2026 年  月</p>

  <div class="info-row">
    <span>姓名：__________</span>
    <span>本月目标：____ 天</span>
    <span>已完成：<span id="pDays">0</span> 天</span>
    <span>总页数：<span id="pPages">0</span> 页</span>
  </div>

  <table id="printTable">
    <thead>
    <tr>
      <th class="col-day">周</th>
      <th class="col-date">日</th>
      <th class="col-book">书名</th>
      <th class="col-from">从</th>
      <th class="col-to">到</th>
      <th class="col-pages">页数</th>
      <th class="col-note">读了什么</th>
      <th class="col-sign">家长签</th>
    </tr>
    </thead>
    <tbody id="printBody"></tbody>
  </table>

  <div class="sign-row">
    <span>本月小结：______________________</span>
    <span>家长签名：________</span>
  </div>
  <div style="text-align:center;font-size:10px;color:#aaa;margin-top:4px;">💡 每天至少30分钟 | 读完自己填 | 家长每周检查</div>
</div>

<script>
// ===== Data =====
const KEY = 'kid_reading_log';
let logs = JSON.parse(localStorage.getItem(KEY) || '[]');
const MONTH_NAMES = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function save() { localStorage.setItem(KEY, JSON.stringify(logs)); }

function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function curMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

document.getElementById('fDate').value = today();

// ===== Save =====
function saveEntry() {
  const date = document.getElementById('fDate').value;
  const book = document.getElementById('fBook').value.trim();
  const from = parseInt(document.getElementById('fFrom').value);
  const to = parseInt(document.getElementById('fTo').value);
  const note = document.getElementById('fNote').value.trim();

  if (!book) return alert('请输入书名');
  if (!from || !to || to <= from) return alert('请输入正确的起止页码');
  if (!note) return alert('简单写两句读了什么');

  logs.push({ date, book, from, to, note, ts: Date.now() });
  save();
  document.getElementById('fBook').value = '';
  document.getElementById('fFrom').value = '';
  document.getElementById('fTo').value = '';
  document.getElementById('fNote').value = '';
  refresh();
}

// ===== Delete =====
function del(ts) {
  if (!confirm('删除这条？')) return;
  logs = logs.filter(l => l.ts !== ts);
  save();
  refresh();
}

// ===== Refresh =====
function refresh() {
  const m = curMonth();
  const mLogs = logs.filter(l => l.date.startsWith(m)).reverse();

  // Stats
  const days = new Set(mLogs.map(l => l.date)).size;
  const books = new Set(mLogs.map(l => l.book)).size;
  const pages = mLogs.reduce((s,l) => s + (l.to - l.from), 0);
  document.getElementById('sDays').textContent = days;
  document.getElementById('sBooks').textContent = books;
  document.getElementById('sPages').textContent = pages;

  // Entry list
  const el = document.getElementById('entryList');
  if (mLogs.length === 0) {
    el.innerHTML = '<div class="empty-msg">本月还没有记录 📭</div>';
  } else {
    el.innerHTML = mLogs.map(l => `
      <div class="entry-item">
        <div class="info">
          <span class="book">${l.book}</span>
          <span class="pages"> 第${l.from}-${l.to}页</span>
          <div class="note">${l.date} · ${l.note}</div>
        </div>
        <span class="del" onclick="del(${l.ts})">✕</span>
      </div>
    `).join('');
  }

  // Update book list
  const allBooks = [...new Set(logs.map(l => l.book))].sort();
  document.getElementById('bookList').innerHTML = allBooks.map(b => `<option value="${b}">`).join('');
}

// ===== Print View =====
function showPrint() {
  const m = curMonth();
  const year = m.split('-')[0];
  const monthNum = parseInt(m.split('-')[1]);
  document.getElementById('printMonth').textContent = `${year} 年 ${monthNum} 月`;

  const mLogs = logs.filter(l => l.date.startsWith(m));
  const days = new Set(mLogs.map(l => l.date)).size;
  const pages = mLogs.reduce((s,l) => s + (l.to - l.from), 0);
  document.getElementById('pDays').textContent = days;
  document.getElementById('pPages').textContent = pages;

  // Build table: 31 rows
  const daysInMonth = new Date(year, monthNum, 0).getDate();
  let html = '';
  let week = 1;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${m}-${String(d).padStart(2,'0')}`;
    const dayLogs = mLogs.filter(l => l.date === dateStr);
    const isFirstOfWeek = (d-1) % 7 === 0;

    if (isFirstOfWeek && d > 1) week++;

    let book = '', from = '', to = '', pagesStr = '', note = '';
    if (dayLogs.length > 0) {
      // Merge multiple entries on same day
      const entries = dayLogs.map(l => `${l.book}(${l.from}-${l.to}页)`).join('，');
      book = dayLogs.map(l => l.book).join('、');
      from = dayLogs[0].from;
      to = dayLogs[dayLogs.length-1].to;
      pagesStr = dayLogs.reduce((s,l) => s + (l.to - l.from), 0);
      note = dayLogs[0].note;
      if (dayLogs.length > 1) note += '...';
    }

    html += `<tr>
      ${isFirstOfWeek ? `<td rowspan="${Math.min(7, daysInMonth-d+1)}" style="font-size:10px;writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:2px;">第${week}周</td>` : ''}
      <td>${d}</td>
      <td>${book}</td>
      <td>${from}</td>
      <td>${to}</td>
      <td>${pagesStr}</td>
      <td>${note}</td>
      <td></td>
    </tr>`;
  }
  document.getElementById('printBody').innerHTML = html;

  // Scroll to print area and open print dialog
  document.querySelector('.print-container').scrollIntoView({ behavior: 'smooth' });
  setTimeout(() => window.print(), 500);
}

// ===== Init =====
refresh();

// ===== PWA =====
(function() {
  const m = {
    name: '阅读打卡表', short_name: '阅读打卡', description: '儿童阅读打卡记录',
    start_url: location.href, display: 'standalone',
    background_color: '#ffffff', theme_color: '#4a90d9',
    icons: [{ src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">📖</text></svg>', sizes: '192x192', type: 'image/svg+xml' }]
  };
  document.querySelector('link[rel="manifest"]').href = 'data:application/json,' + encodeURIComponent(JSON.stringify(m));
})();

if ('serviceWorker' in navigator) {
  const sw = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>new Response('',{status:200}))))`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'})),{scope:'/'}).catch(()=>{});
}
</script>
</body>
</html>
